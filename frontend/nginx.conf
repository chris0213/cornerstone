# 基石前端 Nginx 配置（容器内）
# 注意：CORS 由后端 CORSMiddleware 统一管理，此处不再设置 Access-Control-Allow-Origin
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain application/json application/javascript text/css text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    # 健康检查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # FastAPI 文档与 OpenAPI（生产环境关闭）
    location ~ ^/(docs|redoc|openapi.json) {
        deny all;
        return 404;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # API 反向代理到后端容器
    location /api/ {
        # OPTIONS 预检请求直接返回（让浏览器完成跨域握手）
        # CORS 响应头由后端 CORSMiddleware 统一发出，nginx 不再重复设置，
        # 避免出现后端严格白名单 + nginx 通配 * 的冲突
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
