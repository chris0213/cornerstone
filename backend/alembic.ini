[alembic]
script_location = alembic
# 让 alembic 各子命令（history/current/upgrade...）都能 import src.*
prepend_sys_path = .
# 数据库连接不在 ini 里写死：统一由 alembic/env.py 从 Settings(DATABASE_URL_SYNC) 读取，
# 避免开发 SQLite 地址被误用于生产迁移。
# sqlalchemy.url =

[post_write_hooks]
hooks = 
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = 
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = 
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
