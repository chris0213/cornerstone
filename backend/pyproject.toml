[tool.poetry]
name = "cornerstone-backend"
version = "0.1.0"
description = "IT Infrastructure Resource Management Platform Backend"
authors = ["Developer <developer@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.136.3"
starlette = "1.3.1"
uvicorn = "^0.24.0"
websockets = "^17.0"  # uvicorn 的 WebSocket 支持（缺失时 ws:// 升级请求全部 404）
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
pydantic = "2.13.4"
pydantic-settings = "^2.2.1"
python-jose = ">=3.4.0"  # 3.4.0 修复 CVE-2024-33664 (JWE 炸弹) 与 CVE-2024-33663 (算法混淆)
passlib = "^1.7.4"
bcrypt = "^3.2.0"
netmiko = "^4.3.0"
paramiko = "^3.4.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
aiosqlite = "^0.22.0"
redis = "^5.0.1"
python-multipart = ">=0.0.31"  # 修复 9 个 CVE (路径穿越/DoS/参数走私)
python-dotenv = "^1.0.0"
cryptography = "^50.0.0"  # 修复 12 个 CVE (PKCS12/NULL 指针/缓冲区溢出)
apscheduler = "^3.10.4"
ping3 = "^4.0.1"
pillow = "^12.3.0"  # 修复 20+ 个 CVE (堆溢出/越界/DoS)
captcha = "^0.5.0"
greenlet = "^3.0.0"
email-validator = "^2.2.0"
httpx = "^0.25.2"
openpyxl = "^3.1.5"
reportlab = "^4.2.0"
scapy = "^2.5.0"
ldap3 = "^2.9.1"
pyasn1 = ">=0.6.4"  # 修复 4 个 CVE (paramiko/python-jose 传递依赖)

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"  # 修复 PYSEC-2026-1845
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
