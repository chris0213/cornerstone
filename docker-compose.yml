# 基石 Cornerstone - Docker Compose 部署
# 使用方式：
#   1) cp .env.docker.example .env
#   2) 修改 .env 中的密码与 SECRET_KEY
#   3) docker compose up -d --build
#   4) 浏览器访问 http://<server-ip>

name: cornerstone

services:
  postgres:
    image: postgres:16-alpine
    container_name: cornerstone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cornerstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cornerstone}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cornerstone} -d ${POSTGRES_DB:-cornerstone}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cornerstone-net

  redis:
    image: redis:7-alpine
    container_name: cornerstone-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cornerstone-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cornerstone/backend:latest
    container_name: cornerstone-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cornerstone}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cornerstone}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-cornerstone}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cornerstone}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # 应用
      APP_NAME: ${APP_NAME:-Cornerstone API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:-}
      BACKUP_DIR: /opt/cornerstone/backups
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # 可信代理：compose 内 frontend(nginx) 反代到 backend，后端需采信其 X-Forwarded-For
      # 才能按客户端真实 IP 判定白名单。默认放行 compose 默认网络的常见网段。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8}
      TZ: Asia/Shanghai
    volumes:
      - backend_backups:/opt/cornerstone/backups
      - backend_data:/app/data
    networks:
      - cornerstone-net
    # 默认不对宿主机暴露 8000，由 frontend 容器内部反代
    # 如需直接访问 API，可取消注释：
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cornerstone/frontend:latest
    container_name: cornerstone-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
    networks:
      - cornerstone-net

volumes:
  postgres_data:
  redis_data:
  backend_backups:
  backend_data:

networks:
  cornerstone-net:
    driver: bridge
